name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The shared core library (volodya4u/core) is not published to a Maven
      # repository, so build it and install it into the local one first.
      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

  # Runs the packaged service against a real Kafka broker and sends the same
  # ProductCreatedEvent twice with one messageId: the service must handle it
  # once, calling the remote service a single time, and skip the duplicate.
  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.2.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Package
        run: mvn -B -ntp package -DskipTests

      # Stands in for the remote service the handler calls at
      # http://localhost:8082/response/200, and logs every request.
      - name: Start stub remote service
        run: |
          mkdir -p stub/response
          echo '{"status":"ok"}' > stub/response/200
          nohup python3 -u -m http.server 8082 --directory stub > stub.log 2>&1 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:8082/; do sleep 1; done'

      - name: Create topic
        run: >-
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:9092 --create --if-not-exists
          --topic product-created-events-topic --partitions 3 --replication-factor 1

      - name: Start service
        run: |
          nohup java -jar target/*.jar --spring.kafka.consumer.bootstrap-servers=localhost:9092 \
            > service.log 2>&1 &
          timeout 120 bash -c 'until grep -q "partitions assigned" service.log; do sleep 2; done'

      # Each line is: headers, key, value (tab-separated), as ProductsMicroservice
      # publishes them.
      - name: Send the same event twice
        run: |
          headers='messageId:smoke-message-1,__TypeId__:com.appsdeveloperblog.ws.core.events.ProductCreatedEvent'
          event='{"productId":"smoke-product-1","title":"Smoke test product","price":10.5,"quantity":2}'
          for i in 1 2; do
            printf '%s\t%s\t%s\n' "$headers" smoke-product-1 "$event"
          done |
            docker exec -i ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server localhost:9092 --topic product-created-events-topic \
              --reader-property parse.headers=true --reader-property parse.key=true

      - name: Check that the duplicate was skipped
        run: |
          timeout 60 bash -c 'until grep -q "Found a duplicate message id: smoke-message-1" service.log; do sleep 2; done'
          test "$(grep -c 'Received a new event: Smoke test product' service.log)" -eq 2
          test "$(grep -c 'Received response from a remote service' service.log)" -eq 1
          test "$(grep -c '"GET /response/200' stub.log)" -eq 1

      - name: Show service log
        if: always()
        run: cat service.log || true

  # Merge Dependabot's patch and minor updates once build-and-test and the Kafka
  # smoke test have passed. Docker image updates and minor Spring Boot parent
  # updates are left for review.
  dependabot-auto-merge:
    needs: [build-and-test, smoke-test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
